<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kwestionariusz FEA-FBB</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Palette: one-hue blue ramp (differs in lightness, so it survives every type of
     colour blindness) + orange accent (Okabe-Ito). Every option also carries a number,
     a text label and a fill-level icon, so colour is never the only cue. */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #14213d;
    --muted: #4b5563;
    --border: #9aa5b5;
    --accent: #d55e00;
    --accent-text: #ffffff;
    --focus: #d55e00;
    --track: #d6dbe3;
    --s0: #eaf2fb; --s0t: #14213d;
    --s1: #a6cbe8; --s1t: #14213d;
    --s2: #3d86c6; --s2t: #ffffff;
    --s3: #0b2e5c; --s3t: #ffffff;
    --shadow: 0 2px 10px rgba(20,33,61,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1521; --surface: #182233; --text: #f1f5fb; --muted: #b4bfd0;
      --border: #6f7f98; --accent: #f0a45a; --accent-text: #1a1206; --focus: #f0a45a; --track: #34425a;
      --s0: #22324b; --s0t: #f1f5fb;
      --s1: #3d6a99; --s1t: #ffffff;
      --s2: #8fc0ee; --s2t: #0e1521;
      --s3: #e3f0ff; --s3t: #0e1521;
      --shadow: 0 2px 10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1521; --surface: #182233; --text: #f1f5fb; --muted: #b4bfd0;
    --border: #6f7f98; --accent: #f0a45a; --accent-text: #1a1206; --focus: #f0a45a; --track: #34425a;
    --s0: #22324b; --s0t: #f1f5fb;
    --s1: #3d6a99; --s1t: #ffffff;
    --s2: #8fc0ee; --s2t: #0e1521;
    --s3: #e3f0ff; --s3t: #0e1521;
    --shadow: 0 2px 10px rgba(0,0,0,.5);
  }

  html { font-size: 18px; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #app { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .topbar h1 { font-size: .95rem; font-weight: 700; flex: 1; color: var(--muted); }
  .icon-btn {
    min-width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--surface); cursor: pointer; font-size: 1.05rem;
  }

  .progress-text { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 10px; background: var(--track); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--s3); width: 0; transition: width .25s; }
  .dots { display: flex; gap: 3px; margin: 8px 0 18px; flex-wrap: wrap; }
  .dot {
    flex: 1 0 0; min-width: 8px; height: 22px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; padding: 0;
  }
  .dot.answered { border-color: transparent; }
  .dot.current { outline: 3px solid var(--accent); outline-offset: 1px; }
  .dot[data-v="0"] { background: var(--s0); border: 1px solid var(--border); }
  .dot[data-v="1"] { background: var(--s1); }
  .dot[data-v="2"] { background: var(--s2); }
  .dot[data-v="3"] { background: var(--s3); }

  .card { background: var(--surface); border-radius: 18px; padding: 20px 18px; box-shadow: var(--shadow); border: 1px solid var(--track); }
  .section-tag { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); margin-bottom: 8px; }
  .q-num { font-size: .9rem; font-weight: 700; color: var(--muted); }
  .q-pl { font-size: 1.28rem; font-weight: 700; margin: 4px 0 10px; line-height: 1.35; }
  .q-de { font-size: .88rem; color: var(--muted); font-style: italic; border-left: 3px solid var(--track); padding-left: 10px; }

  .options { display: grid; gap: 10px; margin-top: 18px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 14px;
    border-radius: 14px; border: 3px solid transparent; cursor: pointer; text-align: left;
    transition: transform .08s;
  }
  .opt:active { transform: scale(.985); }
  .opt[data-v="0"] { background: var(--s0); color: var(--s0t); border-color: var(--border); }
  .opt[data-v="1"] { background: var(--s1); color: var(--s1t); }
  .opt[data-v="2"] { background: var(--s2); color: var(--s2t); }
  .opt[data-v="3"] { background: var(--s3); color: var(--s3t); }
  .opt .num { font-size: 1.7rem; font-weight: 800; width: 1.2em; text-align: center; }
  .opt .lbl { flex: 1; line-height: 1.2; }
  .opt .lbl b { display: block; font-size: 1.05rem; }
  .opt .lbl small { font-size: .78rem; opacity: .85; }
  .opt .meter { display: flex; gap: 3px; align-items: flex-end; height: 22px; }
  .opt .meter i { width: 7px; border-radius: 2px; border: 2px solid currentColor; opacity: .55; }
  .opt .meter i:nth-child(1) { height: 8px; } .opt .meter i:nth-child(2) { height: 13px; } .opt .meter i:nth-child(3) { height: 18px; }
  .opt .meter i.on { background: currentColor; opacity: 1; }
  .opt .check { width: 28px; height: 28px; border-radius: 50%; border: 3px solid currentColor; display: grid; place-items: center; font-weight: 900; flex: none; }
  .opt.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
  .opt.selected .check { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .opt:not(.selected) .check { opacity: .35; }
  .opt:not(.selected) .check::after { content: ''; }
  .opt.selected .check::after { content: '✓'; }

  .scale-note { font-size: .8rem; color: var(--muted); margin-top: 14px; text-align: center; }

  .field { display: block; margin-top: 14px; }
  .field span { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg);
  }
  .field textarea { min-height: 160px; resize: vertical; }
  .hint { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .intro p { margin-top: 10px; }
  .legend { list-style: none; margin-top: 12px; display: grid; gap: 6px; }
  .legend li { display: flex; align-items: center; gap: 10px; font-size: .95rem; }
  .legend .sw { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; border: 2px solid var(--border); flex: none; }
  .sw[data-v="0"] { background: var(--s0); color: var(--s0t); } .sw[data-v="1"] { background: var(--s1); color: var(--s1t); }
  .sw[data-v="2"] { background: var(--s2); color: var(--s2t); } .sw[data-v="3"] { background: var(--s3); color: var(--s3t); }

  table.sum { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .9rem; }
  table.sum td { padding: 8px 4px; border-bottom: 1px solid var(--track); vertical-align: top; }
  table.sum td.n { width: 2.4em; font-weight: 700; color: var(--muted); }
  table.sum td.v { width: 46px; text-align: center; }
  table.sum .sw { width: 34px; height: 34px; margin: 0 auto; }
  table.sum tr { cursor: pointer; }
  table.sum tr.missing .sw { background: transparent; color: var(--accent); border-style: dashed; }

  .actions { display: grid; gap: 10px; margin-top: 18px; }
  .btn {
    min-height: 52px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface);
    font-weight: 700; cursor: pointer; padding: 0 16px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--accent); }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 14px rgba(0,0,0,.08);
  }
  .nav-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .nav .btn { flex: 1; min-height: 54px; }
  .nav .btn:disabled { opacity: .35; cursor: not-allowed; }
  .saved { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 6px; min-height: 1em; }

  @media print {
    .nav, .topbar, .dots, .actions { display: none; }
    body { background: #fff; color: #000; }
  }

  .langs { display: flex; gap: 6px; }
  .lang {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    width: 46px; height: 44px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--surface); cursor: pointer; padding: 0;
  }
  .lang svg { width: 28px; height: 18px; border-radius: 3px; border: 1px solid var(--border); display: block; }
  .lang span { font-size: .62rem; font-weight: 800; letter-spacing: .5px; color: var(--text); line-height: 1; }
  .lang.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .send { margin-top: 22px; padding-top: 16px; border-top: 2px solid var(--track); }
  .send h3 { font-size: 1.05rem; }
  .send .hint { margin-top: 6px; }
  @media (max-width: 420px) { .topbar h1 { font-size: .78rem; } .lang { width: 42px; } .icon-btn { min-width: 40px; } }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="apptitle"></h1>
    <div class="langs" id="langs" role="group" aria-label="Language / Sprache / Język"></div>
    <button class="icon-btn" id="theme">◐</button>
  </div>
  <div class="progress-text"><span id="ptext"></span><span id="pcount"></span></div>
  <div class="bar" role="progressbar"><div id="pfill"></div></div>
  <div class="dots" id="dots"></div>
  <main id="view" aria-live="polite"></main>
  <div class="saved" id="saved"></div>
</div>

<div class="nav"><div class="nav-in">
  <button class="btn" id="prev"></button>
  <button class="btn primary" id="next"></button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script>
const LANGS = ['pl', 'de', 'en'];

const SCALE = [
  { v: 0, pl: 'wcale',              de: 'gar nicht',  en: 'not at all' },
  { v: 1, pl: 'trochę',             de: 'ein wenig',  en: 'a little' },
  { v: 2, pl: 'w znacznym stopniu', de: 'weitgehend', en: 'considerably' },
  { v: 3, pl: 'szczególnie mocno',  de: 'besonders',  en: 'especially' },
];

// de = original wording of the FEA-FBB form (this is what goes into the PDF / e-mail)
const QUESTIONS = [
  { id:'q01', pl:'Często miał trudność ze zwracaniem uwagi na szczegóły lub z unikaniem błędów z nieuwagi, np. przy pracach szkolnych lub innych czynnościach.', en:'Often had difficulty paying attention to details or avoiding careless mistakes, e.g. in schoolwork or other activities.', de:'Es fiel ihr / ihm oft schwer, Einzelheiten zu beachten oder Flüchtigkeitsfehler zu vermeiden, z.B. bei Schularbeiten oder bei anderen Tätigkeiten.' },
  { id:'q02', pl:'Często miał trudność z utrzymaniem koncentracji przy zadaniach lub podczas zabawy.', en:'Often had difficulty sustaining concentration on tasks or while playing.', de:'Es fiel ihr / ihm oft schwer, sich bei Aufgaben oder beim Spiel dauerhaft zu konzentrieren.' },
  { id:'q03', pl:'Często nie potrafił właściwie słuchać, gdy zwracano się do niego bezpośrednio.', en:'Often could not listen properly when spoken to directly.', de:'Sie / er konnte häufig nicht richtig zuhören, wenn sie / er direkt angesprochen wurde.' },
  { id:'q04', pl:'Często miał trudność z pełnym wykonywaniem poleceń i z doprowadzaniem do końca prac szkolnych lub innych zadań.', en:'Often had difficulty fully carrying out instructions from others and finishing schoolwork or other tasks.', de:'Sie / er hatte oft Schwierigkeiten, Aufträge von anderen vollständig durchzuführen und Schularbeiten oder andere Arbeiten zu Ende zu bringen.' },
  { id:'q05', pl:'Często miał trudność z organizowaniem zadań lub czynności.', en:'Often had difficulty organizing tasks or activities.', de:'Sie / er hatte oft Schwierigkeiten, Aufgaben oder Aktivitäten zu organisieren.' },
  { id:'q06', pl:'Często unikał zadań wymagających dłuższej koncentracji i wysiłku albo wykonywał je tylko niechętnie.', en:'Often avoided tasks that required sustained concentration and effort, or did them only reluctantly.', de:'Sie / er hatte oft Aufgaben vermieden, bei denen sie / er sich länger konzentrieren und anstrengen musste oder sie / er hat sie nur widerwillig gemacht.' },
  { id:'q07', pl:'Często gubił przedmioty potrzebne do zadań lub czynności (np. zabawki, zeszyty, klucze, książki).', en:'Often lost things needed for tasks or activities (e.g. toys, homework notebooks, keys or books).', de:'Sie / er hat oft Gegenstände verloren, die für bestimmte Aufgaben oder Aktivitäten nötig waren (z.B. Spielsachen, Hausaufgabenhefte, Schlüssel oder Bücher).' },
  { id:'q08', pl:'Łatwo się rozpraszał.', en:'Was easily distracted.', de:'Sie / er war leicht ablenkbar.' },
  { id:'q09', pl:'W codziennym życiu często bywał zapominalski.', en:'Was often forgetful in daily life.', de:'Sie / er war im Alltag häufig vergesslich.' },
  { id:'q10', pl:'Jego ręce i stopy były ciągle w ruchu i nie potrafił spokojnie usiedzieć.', en:'Hands and feet were constantly in motion and could not sit still.', de:'Ihre / seine Hände und Füße waren ständig in Bewegung und sie / er konnte nicht ruhig sitzen bleiben.' },
  { id:'q11', pl:'Często wstawał podczas lekcji lub w innych sytuacjach, w których było to nieodpowiednie.', en:'Often got up during lessons or in other situations where it was inappropriate.', de:'Sie / er stand oft im Unterricht oder in anderen Situationen auf, in denen es unpassend war.' },
  { id:'q12', pl:'Miał trudność ze spokojną zabawą lub spokojnym spędzaniem czasu wolnego.', en:'Had difficulty playing quietly or engaging in leisure activities quietly.', de:'Es fiel ihr / ihm schwer, ruhig zu spielen oder sich mit Freizeitaktivitäten ruhig zu beschäftigen.' },
  { id:'q13', pl:'Często zrywał się i biegał dookoła, gdy było to nieodpowiednie.', en:'Often jumped up and ran around when it was inappropriate.', de:'Sie / er ist häufig aufgesprungen und herumgelaufen, wenn es unpassend war.' },
  { id:'q14', pl:'Często czuł się niespokojny i zdenerwowany.', en:'Often felt restless and nervous.', de:'Sie / er fühlte sich oft unruhig und nervös.' },
  { id:'q15', pl:'Był ciągle i w dużym stopniu w ruchu — i trudno było go w tym powstrzymać.', en:'Was constantly and to a great extent on the move, and others could hardly restrain this.', de:'Sie / er war ständig und in einem starken Ausmaß in Bewegung und konnte darin auch kaum durch andere begrenzt werden.' },
  { id:'q16', pl:'Często był „ciągle na chodzie" (w nieustannym ruchu).', en:'Was often “on the go” (in constant motion).', de:'Sie / er war häufig „auf Achse".' },
  { id:'q17', pl:'Często wyrywał się z odpowiedzią, zanim pytanie zostało do końca zadane.', en:'Often blurted out answers before questions had been finished.', de:'Sie / er platzte häufig mit Antworten heraus, bevor Fragen zu Ende gestellt waren.' },
  { id:'q18', pl:'Często z trudem czekał, aż przyjdzie jego kolej (np. w grach lub w grupie).', en:'Often had difficulty waiting for their turn (e.g. in games or in a group).', de:'Sie / er konnte häufig nur schwer warten, bis sie / er an der Reihe war (z.B. bei Spielen oder in einer Gruppe).' },
  { id:'q19', pl:'Często przerywał lub przeszkadzał innym (np. podczas zabawy lub rozmowy).', en:'Often interrupted or disturbed others (e.g. during games or conversation).', de:'Sie / er unterbrach oder störte andere häufig (z.B. beim Spiel oder im Gespräch).' },
  { id:'q20', pl:'Często mówił nadmiernie dużo.', en:'Often talked excessively.', de:'Sie / er redete häufig übermäßig viel.' },
  { id:'a1', part:'A', pl:'Opisane problemy były wówczas dla niego ogółem bardzo obciążające.', en:'The problems described were, overall, very distressing for them at the time.', de:'Die beschriebenen Probleme waren damals für sie / ihn insgesamt sehr belastend.' },
  { id:'a2', part:'A', pl:'Opisane problemy znacząco pogarszały jego wyniki w szkole.', en:'The problems described considerably impaired their performance at school.', de:'Die beschriebenen Probleme beeinträchtigten damals ihre / seine Leistungsfähigkeit in der Schule erheblich.' },
  { id:'a3', part:'A', pl:'Opisane problemy znacząco pogarszały jego relacje z nauczycielami.', en:'The problems described considerably impaired their relationships with teachers.', de:'Die beschriebenen Probleme beeinträchtigten damals ihre / seine Beziehungen zu Lehrern erheblich.' },
  { id:'a4', part:'A', pl:'Opisane problemy znacząco pogarszały jego relacje z rodzicami, przyjaciółmi lub kolegami z klasy.', en:'The problems described considerably impaired their relationships with parents, friends or classmates.', de:'Die beschriebenen Probleme beeinträchtigten damals ihre / seine Beziehungen zu Eltern, Freunden oder Klassenkameraden erheblich.' },
  { id:'a5', part:'A', pl:'Opisane problemy znacząco utrudniały mu czas wolny lub hobby.', en:'The problems described considerably impaired their leisure time or hobbies.', de:'Die beschriebenen Probleme beeinträchtigten sie / ihn in der Freizeit oder bei ihren / seinen Hobbys erheblich.' },
];
const NQ = QUESTIONS.length;

const UI = {
  pl: {

    stStart: 'Start', stQ: (n, t) => `Pytanie ${n} z ${t}`, stNotes: 'Uwagi', stSum: 'Podsumowanie',

    person: 'Imię i nazwisko osoby ocenianej', by: 'Wypełnił(a)', rel: 'Relacja do osoby ocenianej', relPick: '— wybierz —',
    mother: 'Matka', father: 'Ojciec', date: 'Data wypełnienia',
    introHint: 'Odpowiedzi zapisują się automatycznie tylko w tej przeglądarce na tym urządzeniu. Można wrócić w każdej chwili.',

    sumMissing: n => `Brakuje odpowiedzi: ${n}`, sumDone: 'Wszystko wypełnione ✓', sumHint: 'Dotknij wiersza, aby wrócić do pytania i zmienić odpowiedź.',
    sendH: 'Wyślij do lekarki', sendNote: 'PDF i e-mail są po niemiecku: oryginalne pytania, odpowiedzi z niemieckimi nazwami.',

  de: {

    stStart: 'Start', stQ: (n, t) => `Frage ${n} von ${t}`, stNotes: 'Bemerkungen', stSum: 'Zusammenfassung',

const FLAGS = {
  pl: '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="10" fill="#fff"/><rect y="10" width="30" height="10" fill="#dc143c"/></svg>',
  de: '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="7" fill="#000"/><rect y="7" width="30" height="6.7" fill="#dd0000"/><rect y="13.4" width="30" height="6.6" fill="#ffce00"/></svg>',
  en: '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#fff" stroke-width="4"/><path d="M0,0 L30,20 M30,0 L0,20" stroke="#c8102e" stroke-width="1.6"/><path d="M15,0 V20 M0,10 H30" stroke="#fff" stroke-width="6"/><path d="M15,0 V20 M0,10 H30" stroke="#c8102e" stroke-width="3.4"/></svg>',
};
const LANG_NAMES = { pl: 'Polski', de: 'Deutsch', en: 'English' };

// Steps: 0 = intro, 1..NQ = questions, NQ+1 = notes, NQ+2 = summary
const STEP_NOTES = NQ + 1, STEP_SUM = NQ + 2, LAST = STEP_SUM;
const KEY = 'fea-fbb-v1';

const today = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
const freshData = () => ({ step: 0, lang: 'pl', answers: {}, meta: { person: 'Rafal Sladek', date: today(), by: '', rel: '' }, notes: '' });
let data = freshData();
const T = () => UI[data.lang] || UI.pl;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) data = { ...data, ...s, meta: { ...data.meta, ...s.meta } };
  } catch (e) {}
  if (data.meta.rel === 'Matka') data.meta.rel = 'mother';
  if (data.meta.rel === 'Ojciec') data.meta.rel = 'father';
  if (!LANGS.includes(data.lang)) data.lang = 'pl';
}
let saveTimer;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { flash(T().saveErr); return; }
  flash(T().saved);
}
function flash(msg) {
  const el = $('saved'); el.textContent = msg;
  clearTimeout(saveTimer); saveTimer = setTimeout(() => el.textContent = '', 2600);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const answeredCount = () => QUESTIONS.filter(q => data.answers[q.id] !== undefined).length;
const labelOf = (q, i) => q.part ? 'A' + q.id.slice(1) : String(i + 1);
const relText = () => data.meta.rel ? T()[data.meta.rel] : '';

function meter(v) { return `<span class="meter" aria-hidden="true">${[1,2,3].map(i => `<i class="${v >= i ? 'on' : ''}"></i>`).join('')}</span>`; }

function renderChrome() {
  document.documentElement.lang = data.lang;
  const t = T();
  $('apptitle').textContent = t.appTitle;
  $('theme').setAttribute('aria-label', t.theme); $('theme').title = t.theme;
  $('langs').innerHTML = LANGS.map(l => `<button class="lang ${l === data.lang ? 'on' : ''}" data-lang="${l}" aria-pressed="${l === data.lang}" aria-label="${LANG_NAMES[l]}" title="${LANG_NAMES[l]}">${FLAGS[l]}<span>${l.toUpperCase()}</span></button>`).join('');
}

function renderDots() {
  $('dots').innerHTML = QUESTIONS.map((q, i) => {
    const a = data.answers[q.id];
    const cls = (a !== undefined ? 'answered ' : '') + (data.step === i + 1 ? 'current' : '');
    return `<button class="dot ${cls}" data-v="${a ?? ''}" data-go="${i + 1}" aria-label="${T().dotAria(i + 1, a)}"></button>`;
  }).join('');
}

function render() {
  const s = data.step, v = $('view'), t = T(), L = data.lang;
  renderChrome();
  $('pcount').textContent = t.answered(answeredCount(), NQ);
  $('pfill').style.width = `${(answeredCount() / NQ) * 100}%`;
  $('ptext').textContent = s === 0 ? t.stStart : s <= NQ ? t.stQ(s, NQ) : s === STEP_NOTES ? t.stNotes : t.stSum;
  $('prev').textContent = t.back; $('prev').disabled = s === 0;
  $('next').textContent = s === LAST ? t.toStart : s === 0 ? t.begin : t.next;
  $('next').disabled = s === LAST;
  renderDots();

  if (s === 0) {
    v.innerHTML = `<div class="card intro">
      <div class="section-tag">${t.introTag}</div>
      <h2 style="font-size:1.3rem">${t.introH}</h2>
      <p>${t.introP}</p>
      <ul class="legend">${SCALE.map(o => `<li><span class="sw" data-v="${o.v}">${o.v}</span><span><b>${o[L]}</b>${L !== 'de' ? ` <small style="color:var(--muted)">(${o.de})</small>` : ''}</span></li>`).join('')}</ul>
      <label class="field"><span>${t.person}</span><input data-meta="person" value="${esc(data.meta.person)}" autocomplete="off"></label>
      <label class="field"><span>${t.by}</span><input data-meta="by" value="${esc(data.meta.by)}" autocomplete="off"></label>
      <label class="field"><span>${t.rel}</span><select data-meta="rel"><option value="" ${data.meta.rel ? '' : 'selected'} disabled>${t.relPick}</option>${['mother', 'father'].map(r => `<option value="${r}" ${data.meta.rel === r ? 'selected' : ''}>${t[r]}</option>`).join('')}</select></label>
      <label class="field"><span>${t.date}</span><input type="date" data-meta="date" value="${esc(data.meta.date)}"></label>
      <p class="hint">${t.introHint}</p>
    </div>`;
  } else if (s <= NQ) {
    const q = QUESTIONS[s - 1], cur = data.answers[q.id];
    v.innerHTML = `<div class="card">
      <div class="section-tag">${q.part === 'A' ? t.tagFollow : t.tagDesc}</div>
      <div class="q-num">${labelOf(q, s - 1)}.</div>
      <div class="q-pl">${esc(q[L])}</div>
      ${L !== 'de' ? `<div class="q-de" lang="de">${esc(q.de)}</div>` : ''}
      <div class="options" role="radiogroup">
        ${SCALE.map(o => `<button class="opt ${cur === o.v ? 'selected' : ''}" data-v="${o.v}" role="radio" aria-checked="${cur === o.v}">
          <span class="num">${o.v}</span>
          <span class="lbl"><b>${o[L]}</b>${L !== 'de' ? `<small lang="de">${o.de}</small>` : ''}</span>
          ${meter(o.v)}<span class="check" aria-hidden="true"></span></button>`).join('')}
      </div>
      <div class="scale-note">${t.keysHint}</div>
    </div>`;
  } else if (s === STEP_NOTES) {
    v.innerHTML = `<div class="card">
      <div class="section-tag">Bemerkungen</div>
      <h2 style="font-size:1.2rem">${t.notesH}</h2>
      <p class="hint">${t.notesHint}</p>
      <label class="field"><span style="position:absolute;left:-9999px">${t.notesH}</span>
        <textarea id="notes" placeholder="${t.notesPh}">${esc(data.notes)}</textarea></label>
    </div>`;
  } else {
    const rows = QUESTIONS.map((q, i) => {
      const a = data.answers[q.id];
      return `<tr data-go="${i + 1}" class="${a === undefined ? 'missing' : ''}"><td class="n">${q.part ? 'A' + q.id.slice(1) : i + 1}</td><td>${esc(q[L])}</td><td class="v"><div class="sw" data-v="${a ?? ''}">${a ?? '–'}</div></td></tr>`;
    }).join('');
    const missing = NQ - answeredCount();
    v.innerHTML = `<div class="card">
      <div class="section-tag">${t.stSum}</div>
      <h2 style="font-size:1.2rem">${missing ? t.sumMissing(missing) : t.sumDone}</h2>
      <p class="hint">${t.sumHint}</p>
      <table class="sum">${rows}</table>
      <div class="send">
        <h3>${t.sendH}</h3>
        <p class="hint">${t.sendNote}</p>
        <div class="actions">
          <button class="btn primary" id="share">${t.share}</button>
          <button class="btn" id="mail">${t.mail}</button>
          <button class="btn" id="pdf">${t.pdf}</button>
        </div>
        <p class="hint">${t.mailNote}</p>
      </div>
      <div class="actions"><button class="btn danger" id="reset">${t.reset}</button></div>
    </div>`;
  }
}

function go(step) {
  data.step = Math.max(0, Math.min(LAST, step));
  save(); render(); window.scrollTo({ top: 0 });
}

function answer(val) {
  const q = QUESTIONS[data.step - 1]; if (!q) return;
  data.answers[q.id] = val; save(); render();
  // brief pause so the selection is visible, then advance
  setTimeout(() => { if (data.step === QUESTIONS.indexOf(q) + 1) go(data.step + 1); }, 280);
}

// ==PDF-START==
const REL_DE = { mother: 'Mutter', father: 'Vater' };
const PL_MAP = { 'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ó':'O','Ś':'S','Ź':'Z','Ż':'Z' };
// jsPDF's built-in Helvetica only covers WinAnsi, so Polish letters in short fields are transliterated
function pdfSafe(s) {
  return String(s || '').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => PL_MAP[c]).replace(/[^\x20-\x7E -ÿ„“”‘’–—…]/g, '?');
}
function pdfDate(iso) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : ''; }

function buildPdf(jsPDF, d, questions, scale, notesImage) {
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const L = 15, R = 195, XC = 163, CW = 8, CX = i => XC + CW * i + CW / 2;
  const W = R - L, PAGE_MID = (L + R) / 2;
  const name = pdfSafe(d.meta.person), by = pdfSafe(d.meta.by), rel = pdfSafe(REL_DE[d.meta.rel] || ''), date = pdfDate(d.meta.date);
  doc.setDrawColor(0); doc.setTextColor(0); doc.setLineWidth(0.4);
  let y = 12;

  const hline = (yy, x1 = L, x2 = R) => doc.line(x1, yy, x2, yy);
  const vlines = (y1, y2) => { doc.line(L, y1, L, y2); doc.line(R, y1, R, y2); doc.line(XC, y1, XC, y2); };
  const txt = (s, x, yy, size = 9, opts) => { doc.setFontSize(size); doc.text(s, x, yy, opts); };

  // rotated scale labels above the answer columns
  function scaleLabels(top, h) {
    doc.setFontSize(6.5);
    scale.forEach((o, i) => doc.text(o.de, CX(i) + 1.1, top + h - 1.5, { angle: 90 }));
  }

  function textBlock(s, x, yy, width, size, lh) {
    doc.setFontSize(size);
    doc.splitTextToSize(s, width).forEach((l, i) => doc.text(l, x, yy + i * lh));
  }

  function answerRow(label, text, ans) {
    doc.setFontSize(8.5);
    const lines = doc.splitTextToSize(`${label}. ${text}`, XC - L - 4);
    const lh = 3.6, h = Math.max(8.5, lines.length * lh + 4);
    vlines(y, y + h); hline(y + h);
    const ty = y + (h - lines.length * lh) / 2 + 2.8;
    lines.forEach((l, i) => doc.text(l, L + 2, ty + i * lh));
    scale.forEach((o, i) => txt(String(o.v), CX(i), y + h / 2 + 1.3, 10, { align: 'center' }));
    if (ans !== undefined) { doc.setLineWidth(0.5); doc.circle(CX(ans), y + h / 2, 2.6, 'S'); doc.setLineWidth(0.4); }
    y += h;
  }
  const labelOf = (q, i) => q.part ? 'A' + q.id.slice(1) : String(i + 1).padStart(2, '0');
  const rowOf = i => answerRow(labelOf(questions[i], i), questions[i].de, d.answers[questions[i].id]);

  // ---------- page 1 ----------
  doc.setFillColor(205); doc.rect(L, y, W, 14, 'FD'); doc.setFillColor(255);
  txt('Anhang 6: ADHS-Fragebogen für Erwachsene', PAGE_MID, y + 5.8, 13, { align: 'center' });
  txt('Frühere Probleme, Fremdbeurteilung (FEA-FBB)', PAGE_MID, y + 11.6, 13, { align: 'center' });
  y += 14;

  vlines(y, y + 18 + 17);
  hline(y); hline(y + 9, L, XC); hline(y + 18, L, XC);
  txt(`Name der beurteilten Person: ${name}`, L + 2, y + 6, 9);
  txt('Alter:', 108, y + 6, 9); txt(`Datum: ${date}`, 128, y + 6, 9);
  txt('Berufsausbildung:', L + 2, y + 15, 9); txt('Gegenwärtige Tätigkeit:', 85, y + 15, 9);
  y += 18;
  txt(`Ausgefüllt von: ${by}`, L + 2, y + 6, 9);
  const relLabel = 'Art der Beziehung zur beurteilten Person (z.B. Vater, Mutter): ';
  txt(relLabel, L + 2, y + 13, 9);
  const relX = L + 3 + doc.getTextWidth(relLabel);
  txt(rel, relX, y + 13, 10);
  if (rel) { doc.setLineWidth(0.2); doc.line(relX, y + 13.8, Math.min(XC - 2, relX + 30), y + 13.8); doc.setLineWidth(0.4); }
  y += 17;
  hline(y, L, XC);
  const instr = `Kreuzen Sie bitte für jede Beschreibung die Zahl an, die angibt, wie zutreffend diese Beschreibung für ${name || '____________________'} war, als die Person etwa sechs bis zwölf Jahre alt war (etwa in der Grundschulzeit)`;
  vlines(y, y + 33);
  textBlock(instr, L + 2, y + 6, XC - L - 5, 9, 4.6);
  scaleLabels(y, 33);
  y += 33; hline(y);

  for (let i = 0; i < 18; i++) rowOf(i);
  doc.setFillColor(255); doc.rect(PAGE_MID - 17, y + 3, 34, 7.5, 'S');
  txt('Bitte wenden', PAGE_MID, y + 8, 9, { align: 'center' });

  // ---------- page 2 ----------
  doc.addPage(); y = 12; hline(y);
  for (let i = 18; i < 20; i++) rowOf(i);

  const sec = 'Beantworten Sie bitte abschließend noch folgende Fragen, wenn zumindest eines der auf der ersten Seite beschriebenen Verhaltensprobleme für die Person im Alter von sechs bis zwölf Jahren zutraf.';
  vlines(y, y + 24);
  textBlock(sec, L + 2, y + 6, XC - L - 5, 9.5, 4.8);
  textBlock('Wie zutreffend war die Beschreibung?', XC + 1.5, y + 8, 29, 7.5, 3.6);
  y += 24; hline(y);
  vlines(y, y + 17); scaleLabels(y, 17); y += 17; hline(y);

  for (let i = 20; i < questions.length; i++) rowOf(i);

  const nh = 95;
  vlines(y, y + nh);
  txt('Bemerkungen', (L + XC) / 2, y + 7, 9, { align: 'center' });
  if (d.notes && d.notes.trim() && notesImage) {
    const img = notesImage(d.notes.trim(), XC - L - 6, nh - 14);
    if (img) doc.addImage(img.url, 'PNG', L + 3, y + 11, img.w, img.h);
  }
  y += nh; hline(y);
  doc.setFillColor(255); doc.rect(PAGE_MID - 29, y - 3.7, 58, 7.5, 'FD');
  txt('Vielen Dank für Ihre Mitarbeit', PAGE_MID, y + 1.3, 9, { align: 'center' });

  y += 12;
  doc.setFillColor(228); doc.setLineWidth(0.2); doc.rect(L, y, W, 13, 'FD'); doc.setFillColor(255);
  textBlock('ADHS-Fragebogen für Erwachsene auf der Basis von DSM-IV und ICD-10. © by M. Döpfner, G. Lehmkuhl & H.-C. Steinhausen, Köln und Zürich 2001. Publiziert in: Döpfner et al. (2005): Kinder-Diagnostik-System KIDS, Band 1 Aufmerksamkeitsdefizit- / Hyperaktivitätsstörungen. Göttingen: Hogrefe.', L + 2, y + 4.5, W - 4, 7.5, 3.6);
  return doc;
}
// ==PDF-END==

// Notes can contain Polish letters, so they are drawn on a canvas and embedded as an image
function notesImage(str, wMm, maxHMm) {
  const k = 8, fs = 3.6 * k, lh = 5 * k, W = Math.round(wMm * k);
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = `${fs}px Arial, Helvetica, sans-serif`;
  x.font = font;
  const lines = [];
  str.split('\n').forEach(par => {
    let cur = '';
    par.split(/\s+/).forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (x.measureText(t).width > W && cur) { lines.push(cur); cur = w; } else cur = t;
    });
    lines.push(cur);
  });
  const use = lines.slice(0, Math.max(1, Math.floor(maxHMm * k / lh)));
  c.width = W; c.height = use.length * lh + 8;
  x.font = font; x.fillStyle = '#000'; x.textBaseline = 'top';
  use.forEach((l, i) => x.fillText(l, 0, i * lh + 2));
  return { url: c.toDataURL('image/png'), w: wMm, h: c.height / k };
}

// Everything that goes to the doctor is German, whatever the UI language is.
function pdfName() { return `FEA-FBB_${pdfSafe(data.meta.person).trim().replace(/\s+/g, '_') || 'Person'}.pdf`; }
function mailSubject() { return `FEA-FBB Fragebogen – ${pdfSafe(data.meta.person)}`; }
function relDe() { return REL_DE[data.meta.rel] || ''; }
function introDe() {
  return `Sehr geehrte Damen und Herren,\n\nanbei der ausgefüllte ADHS-Fragebogen für Erwachsene, frühere Probleme, Fremdbeurteilung (FEA-FBB) für ${data.meta.person}.\nAusgefüllt von: ${data.meta.by}${relDe() ? ' (' + relDe() + ')' : ''}\nDatum: ${pdfDate(data.meta.date)}`;
}
function germanText() {
  const lines = [introDe(), '', 'Skala: ' + SCALE.map(o => `${o.v} = ${o.de}`).join(', '), ''];
  QUESTIONS.forEach((q, i) => {
    const a = data.answers[q.id];
    lines.push(`${q.part ? 'A' + q.id.slice(1) : String(i + 1).padStart(2, '0')}. ${q.de}`, `   Antwort: ${a === undefined ? '–' : a + ' (' + SCALE[a].de + ')'}`);
  });
  if (data.notes.trim()) lines.push('', 'Bemerkungen:', data.notes.trim());
  lines.push('', 'Mit freundlichen Grüßen', data.meta.by);
  return lines.join('\n');
}

function makePdf() {
  if (!window.jspdf) { flash(T().pdfFail); return null; }
  const doc = buildPdf(window.jspdf.jsPDF, data, QUESTIONS, SCALE, notesImage);
  return { doc, file: new File([doc.output('blob')], pdfName(), { type: 'application/pdf' }) };
}
function downloadPdf() { const r = makePdf(); if (r) r.doc.save(pdfName()); }

async function sharePdf() {
  const r = makePdf(); if (!r) return;
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [r.file] })) {
    try { await navigator.share({ files: [r.file], title: mailSubject(), text: introDe() }); }
    catch (e) { if (e.name !== 'AbortError') { r.doc.save(pdfName()); flash(T().shareUnsupported); } }
  } else { r.doc.save(pdfName()); flash(T().shareUnsupported); }
}

function mailPdf() {
  downloadPdf();
  const href = `mailto:?subject=${encodeURIComponent(mailSubject())}&body=${encodeURIComponent(germanText())}`;
  setTimeout(() => { location.href = href; }, 400);
}

$('prev').onclick = () => go(data.step - 1);
$('next').onclick = () => go(data.step + 1);
$('dots').onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); };
$('langs').onclick = e => {
  const b = e.target.closest('[data-lang]'); if (!b) return;
  data.lang = b.dataset.lang; save(); render();
};

$('view').addEventListener('click', e => {
  const opt = e.target.closest('.opt'); if (opt) return answer(+opt.dataset.v);
  const row = e.target.closest('tr[data-go]'); if (row) return go(+row.dataset.go);
  const id = e.target.id;
  if (id === 'share') sharePdf();
  if (id === 'mail') mailPdf();
  if (id === 'pdf') downloadPdf();
  if (id === 'reset' && confirm(T().resetConfirm)) {
    const lang = data.lang; data = freshData(); data.lang = lang; save(); render();
  }
});
$('view').addEventListener('change', e => { if (e.target.tagName === 'SELECT') { data.meta[e.target.dataset.meta] = e.target.value; save(); } });
$('view').addEventListener('input', e => {
  if (e.target.dataset.meta) { data.meta[e.target.dataset.meta] = e.target.value; save(); }
  if (e.target.id === 'notes') { data.notes = e.target.value; save(); }
});

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key >= '0' && e.key <= '3' && data.step >= 1 && data.step <= NQ) answer(+e.key);
  else if (e.key === 'ArrowRight') go(data.step + 1);
  else if (e.key === 'ArrowLeft') go(data.step - 1);
});

// theme: follows system unless toggled
$('theme').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('fea-fbb-theme', next); } catch (e) {}
};
try { const t = localStorage.getItem('fea-fbb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

load(); render();
</script>
</body>
</html>
